name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    name: Lint and core tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        # The annotate plugin shows each failing test on the pull request itself.
        run: python -m pip install -r requirements.txt pytest-github-actions-annotate-failures
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Core tests
        run: >
          python -m pytest -q --timeout=300 --basetemp=.test-runs/ci
          tests/test_documentation.py tests/test_plain_output.py tests/test_code_quality.py
          tests/test_tor_on_demand_and_small_talk.py tests/test_retry_and_darkweb_routing.py
          tests/test_camera_consent.py tests/test_chat_completion.py tests/test_launch.py
