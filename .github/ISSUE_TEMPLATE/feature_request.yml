name: Feature request
description: Suggest something HAYAT should do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Example phrases you would say to HAYAT help a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: It needs no paid service or API.
          required: true
        - label: Anything it does to the outside world can wait for the owner's approval.
          required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some guidance"
        - "No, just suggesting"
