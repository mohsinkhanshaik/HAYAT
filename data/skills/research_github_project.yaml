name: research_github_project
description: Research a public GitHub project using its repository, releases, documentation, and issue tracker.
inputs:
  - repository
  - question
tools:
  - research_topic
steps:
  - tool: research_topic
    arguments:
      query: "GitHub {{repository}} {{question}} README documentation releases issues"
      level: normal
      official_only: true
      remember: true
success_criteria:
  - The official repository is included in the evidence.
  - Version-sensitive claims include freshness metadata.
trusted: true
