name: deep_public_research
description: Combine configured public indexes, follow relevant evidence links and return cited findings with source failures.
inputs: [query]
tools: [research_topic]
steps:
  - tool: research_topic
    arguments: {query: "{{query}}", level: deep, remember: false}
success_criteria:
  - Findings cite retrieved evidence and report gaps or unavailable sources.
trusted: true
